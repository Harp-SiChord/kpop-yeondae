<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-POP 연대표 게임</title>
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K-POP 연대표">
<style>
/* 레이아웃: 넓은 화면(노트북·TV)은 왼쪽 무대 + 오른쪽 점수판, 폰은 한 줄로 쌓는다.
   연대표 카드 색은 카드마다 섞어 칠하고, 옆 카드와 비슷한 색이 붙지 않게 한다. */
:root{
  color-scheme:dark;
  --bg:#0f1117; --panel:#181b25; --panel2:#222634; --line:#2e3346;
  --fg:#f4f5f9; --muted:#959cb1; --dim:#5d6378;
  --accent:#7c5cff; --accent2:#ff5c8a; --ok:#3ddc97; --bad:#ff6b6b; --warn:#ffb84d;
  --d40:#c9b394; --d50:#f0c96a; --d60:#3fd0b0; --d70:#ff9a3c; --d80:#ff4f7e; --d90:#4f9bff; --d00:#58d27a; --d10:#9d6bff; --d20:#fde05a;
  --cw:clamp(104px,10vw,132px);
  --card-ink:#1b1d26;
  --fs-year:clamp(22px,2.4vw,34px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",Roboto,"Segoe UI",sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:var(--panel2);padding:12px 16px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
button:hover:not(:disabled){filter:brightness(1.12)}
button:active:not(:disabled){transform:scale(.98)}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent)} .pink{background:var(--accent2)} .ghost{background:transparent;border:1px solid var(--line)}
.ok{background:var(--ok);color:#0b2a1e} .badbtn{background:var(--panel2);color:var(--bad)}
input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)} .tab{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* 상단 */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h1{font-size:18px;font-weight:900;letter-spacing:.2px;flex:1;min-width:0}
.top h1 small{font-weight:600;color:var(--muted);font-size:13px;margin-left:8px}
.top button{min-height:38px;padding:8px 12px;font-size:14px}

/* 설정 화면 */
.setup{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;gap:16px;align-items:center;padding:6px 0 4px}
.logo{width:64px;height:64px;flex:0 0 64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.logo svg{width:34px;height:34px}
.hero h2{font-size:26px;font-weight:900}
.hero p{margin:4px 0 0;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:15px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow input{flex:1}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.prow button{min-height:42px;padding:8px 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{min-width:42px;text-align:center;font-size:20px}
.decades{display:flex;flex-wrap:wrap;gap:8px}
.dec{min-height:40px;padding:8px 12px;border:1px solid var(--line)}
.dec[aria-pressed="true"]{color:var(--card-ink);border-color:transparent}
.foot{color:var(--dim);font-size:12.5px;text-align:center}

/* 게임 화면 */
.top{flex:0 0 auto}
.game{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr);gap:16px}
.game > .score{align-self:start;max-height:100%;overflow:auto}
@media (max-width:900px){.game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)} .game > .score{max-height:none}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.stage > :not(.np){flex:0 0 auto}
.turnline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.turnline .who{font-size:clamp(20px,2.4vw,30px);font-weight:900}
.turnline .sub{color:var(--muted)}

.np{position:relative;border-radius:22px;overflow:hidden;background:var(--panel);flex:1 1 auto;min-height:120px;max-height:340px}
#ytwrap{position:absolute;inset:0;z-index:0;pointer-events:none}
#ytwrap iframe{width:100%;height:100%;border:0;display:block}
.np-cover{position:absolute;inset:0;z-index:1;background:var(--panel)}
.np-face{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,36px);padding:18px;text-align:left}
.np-face.hidden{flex-direction:column;gap:clamp(6px,1.6vh,14px);text-align:center;padding:14px clamp(14px,4vw,40px)}
.wave{display:block;width:100%;max-width:760px;height:clamp(64px,62%,230px);min-height:0;flex:0 1 auto}
.np .hint{color:var(--muted);max-width:30ch;line-height:1.45}
.ans{display:flex;align-items:center;gap:clamp(14px,3vw,30px);animation:pop .35s ease-out;min-width:0}
.ans img{height:clamp(150px,24vh,250px);aspect-ratio:1;border-radius:16px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,.45);background:var(--panel2);max-width:45%}
.ans .t{min-width:0}
.ans .y{font-size:clamp(48px,7vw,84px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ans .a{font-size:clamp(18px,2.2vw,26px);font-weight:800;margin-top:8px}
.ans .s{font-size:clamp(15px,1.8vw,20px);color:var(--muted)}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ans{animation:none}}

.meter{display:flex;align-items:center;gap:10px}
.seek{flex:1;position:relative;padding:12px 0;margin:-8px 0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
.seek.off{cursor:default}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s linear}
.seek .knob{position:absolute;top:50%;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.4);transition:left .2s linear,transform .12s;pointer-events:none}
.seek.off .knob{display:none}
.seek.drag .bar i,.seek.drag .knob{transition:none} .seek.drag .knob{transform:scale(1.25)}
.sec{width:44px;text-align:right;color:var(--muted);font-size:13px}

.status{border-radius:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.status.good{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok)}
.status.badc{border-color:color-mix(in srgb,var(--bad) 60%,transparent);color:var(--bad)}
.status.pick{border-color:var(--warn);color:var(--warn)}

/* 연대표 */
.tlwrap{overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;position:relative}
.tl{display:flex;align-items:center;gap:6px;min-height:var(--cw);width:max-content;margin:0 auto}
.tc{flex:0 0 auto;width:var(--cw);height:var(--cw);border-radius:6px;padding:calc(var(--cw)*.09) calc(var(--cw)*.07) calc(var(--cw)*.13);color:var(--card-ink);display:grid;grid-template-rows:auto 1fr auto;justify-items:center;align-items:center;text-align:center;scroll-snap-align:center;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.tc .a{font-size:calc(var(--cw)*.092);font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .y{font-size:calc(var(--cw)*.29);font-weight:800;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tc .s{font-size:calc(var(--cw)*.088);line-height:1.2;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.85}
.tc .k,.tc .no{position:absolute;bottom:calc(var(--cw)*.04);font-size:calc(var(--cw)*.058);opacity:.55;font-variant-numeric:tabular-nums}
.tc .k{left:calc(var(--cw)*.06)} .tc .no{right:calc(var(--cw)*.06)}
.tc.new{outline:3px solid var(--ok);outline-offset:3px}
/* 자리 고른 카드: 실제 카드와 같은 틀에 그 사람 색 점선 (차례인 사람 · 도전한 사람 모두) */
.tc.ghost{--pc:var(--accent);background:var(--panel2);background:color-mix(in srgb,var(--pc) 18%,var(--panel2));color:var(--fg);border:2px dashed var(--pc);box-shadow:none;font:inherit;cursor:pointer}
.tc.ghost .a{color:var(--pc);font-weight:800}
.tc.ghost .y{color:var(--pc);font-size:calc(var(--cw)*.34)}
.tc.ghost .s{opacity:.8}
.tc.ghost .k{opacity:.7}
.tc.miss{background:var(--panel2);color:var(--bad);border:2px dashed var(--bad);box-shadow:none}
.slot{width:34px;min-height:var(--cw);border-radius:12px;border:2px dashed var(--line);background:transparent;padding:0;color:var(--dim);font-size:22px;flex-direction:column;gap:4px}
.slot:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.slot.right{border-color:var(--ok);color:var(--ok);border-style:solid}
.slot[disabled]{opacity:1}
.tl-empty{color:var(--muted);padding:20px}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1 1 160px;min-height:54px;font-size:16.5px}
.actions .big{flex:2 1 220px}
@media (max-width:600px){
  .np{min-height:110px;max-height:260px} .np .hint{font-size:13px}
  .ans img{height:120px} .ans .y{font-size:44px} .ans .a{font-size:17px;margin-top:4px} .ans .s{font-size:14px}
  .actions{gap:8px} .actions button,.actions .big{flex:1 1 0;min-width:0;min-height:50px;font-size:14.5px;padding:10px 6px}
  .actions #aPlay,.actions #aRev,.actions #aNext,.actions #aOver{flex:1 1 100%}
  .top h1 small{display:none} .top button{padding:6px 10px;font-size:13px}
  .status{padding:10px 12px;font-size:14px}
}
/* 점수판 */
.score{display:flex;flex-direction:column;gap:8px;min-width:0}
@media (max-width:900px){.score{order:-1;flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;align-items:stretch;min-height:0;font-weight:500}
@media (max-width:900px){.pl{flex:0 0 170px}}
.pl.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pl .nm{display:flex;align-items:center;gap:8px;font-weight:800}
.pl .nm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .cnt{font-variant-numeric:tabular-nums;font-weight:800}
.pbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.pbar i{display:block;height:100%}
.tok{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.tok i{width:10px;height:10px;border-radius:50%;background:var(--warn)}
.tok i.off{background:var(--panel2)}
.mini{display:flex;gap:3px;flex-wrap:wrap}
.mini i{width:22px;height:8px;border-radius:2px}
@media (max-width:900px){.mini{display:none}}

/* 시트(모달) */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,6,10,.66);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:700px){.sheet{align-items:center}}
.sheet .in{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(720px,100%);max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:20px}
.sheet .rules{line-height:1.65} .sheet .rules li{margin:4px 0}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;max-width:calc(100% - 32px)}
.win{text-align:center;gap:16px}
.win .trophy{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* 가로가 넓은 화면(펼친 폴드·태블릿·노트북): 버튼을 한 줄에 놓아 세로 공간을 아낀다 */
@media (min-width:601px){
  .actions button,.actions .big{flex:1 1 0;min-width:0;padding:10px 8px}
}
/* 폰을 가로로 돌린 경우처럼 높이가 낮은 화면: 전체를 촘촘하게 */
@media (max-height:520px){
  .top{margin-bottom:6px} .stage{gap:8px} .game{gap:10px}
  .np{height:120px} .np .hint{display:none} .wave{height:70%}
  .ans img{height:96px} .ans .y{font-size:40px} .ans .a{font-size:16px;margin-top:2px} .ans .s{font-size:13px}
  .turnline .who{font-size:20px}
  :root{--cw:96px}
  .status{padding:8px 12px;font-size:13.5px}
  .actions button{min-height:44px;font-size:14.5px}
  .pl{padding:8px 10px;gap:4px} .mini{display:none}
}
/* 폰 가로: 왼쪽 재생 패널, 오른쪽 연대표와 버튼 */
@media (max-height:520px) and (orientation:landscape){
  .game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)} .game > .score{max-height:none}
  .score{order:-1;flex-direction:row;overflow-x:auto} .pl{flex:0 0 170px;padding:6px 10px;gap:3px} .pbar{display:none}
  .top{margin-bottom:4px} .top button{min-height:32px;padding:4px 10px}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);column-gap:14px;row-gap:8px;
    grid-template-areas:"np tl" "meter tl" "status act";align-items:start}
  .turnline{display:none} .np{grid-area:np} .meter{grid-area:meter} .status{grid-area:status} .tlwrap{grid-area:tl} .actions{grid-area:act}
  .actions{gap:6px} .actions button,.actions .big,.actions #aPlay,.actions #aRev,.actions #aNext{flex:1 1 30%;min-width:0;min-height:44px;padding:6px;font-size:14px}
}

</style>
</head>
<body>
<div class="top">
  <h1>K-POP 연대표<small id="topsub"></small></h1>
  <button class="ghost" id="bRules" type="button">규칙</button>
  <button class="ghost" id="bUndo" type="button" hidden>되돌리기</button>
  <button class="ghost" id="bNew" type="button" hidden>새 게임</button>
</div>

<!-- 설정 화면 -->
<main class="setup" id="setup">
  <div class="hero">
    <div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 18.5a3 3 0 1 1-2-2.83V5l11-2v12.5a3 3 0 1 1-2-2.83V7.4L9 8.7z"/></svg></div>
    <div><h2>노래를 듣고 연대표에 끼워 넣기</h2><p>한 대의 화면으로 모두 함께 합니다. 기기를 돌려 가며 하거나 TV에 띄우고, 온라인이면 화면과 소리를 공유하세요.</p></div>
  </div>
  <button class="primary" id="bResume" type="button" hidden>이어 하기</button>

  <section class="box" id="boxPlayers">
    <h3>참가자 (개인 또는 팀)</h3>
    <div class="plist" id="plist"></div>
    <div class="row"><button class="ghost" id="bAddP" type="button">+ 참가자 추가</button><span class="muted" id="pnote"></span></div>
  </section>


  <section class="box">
    <h3>목표</h3>
    <div class="row">
      <span>연대표 카드</span>
      <div class="stepper"><button class="ghost" id="tMinus" type="button" aria-label="목표 줄이기">−</button><b id="tVal" class="tab">10</b><button class="ghost" id="tPlus" type="button" aria-label="목표 늘리기">+</button></div>
      <span class="muted">장을 먼저 모으면 승리 (시작 카드 포함)</span>
    </div>
  </section>

  <section class="box">
    <h3>연대</h3>
    <div class="decades" id="decades"></div>
    <span class="muted" id="poolNote"></span>
  </section>

  <button class="primary" id="bStart" type="button" style="min-height:58px;font-size:18px">게임 시작</button>
  <p class="foot" id="foot">멜론 연간차트 · 벅스 연도별 베스트 · 유튜브 하이라이트 30초</p>
</main>

<!-- 게임 화면 -->
<main class="game" id="game" hidden>
  <section class="stage">
    <div class="turnline"><span class="who" id="who"></span><span class="sub" id="whoSub"></span></div>
    <div class="np" id="np">
      <div id="ytwrap"><div id="yt"></div></div>
      <div class="np-cover"></div>
      <div class="np-face" id="npFace"></div>
    </div>
    <div class="meter"><div class="seek off" id="seek" role="slider" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><div class="bar"><i id="bar"></i></div><span class="knob" id="knob"></span></div><span class="sec tab" id="sec">30초</span></div>
    <div class="status" id="status"></div>
    <div class="tlwrap" id="tlwrap"><div class="tl" id="tl"></div></div>
    <div class="actions" id="actions"></div>
  </section>
  <aside class="score" id="score"></aside>
</main>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== 데이터 · 설정 ===================== */
const CLIP = 30;
const TEST_MUTE = /[?&]mute=1/.test(location.search);           // 개발 확인용: 소리 없이 재생
const SAVE_KEY = 'hitster-kpop-web-v1';
const PCOLORS = ['#7c5cff','#ff5c8a','#3ddc97','#ffb84d','#4cc3ff','#ff8a4c','#c38cff','#9be15d','#ff6bd6','#5ce1e6'];
const DECADES = [1940,1950,1960,1970,1980,1990,2000,2010,2020];   // 1940 = 1940년대 이전 전체
const DCOL = {1940:'var(--d40)',1950:'var(--d50)',1960:'var(--d60)',1970:'var(--d70)',1980:'var(--d80)',1990:'var(--d90)',2000:'var(--d00)',2010:'var(--d10)',2020:'var(--d20)'};
// 카드 색: 연도와 상관없이 카드마다 14색 중 하나 (색상환 순서). 연대표에서 바로 옆 카드와는 색상환에서 3칸 이상,
// 두 칸 앞 카드와도 다른 색이 되게 바꿔 칠한다
const CPAL = [['#ff9a8a','#f2545b'],['#ff6f9e','#e0257a'],['#f58cff','#c94fe0'],['#b083ff','#7b4fe6'],['#d6c4ff','#a58cf5'],
  ['#6fb2ff','#3d76ea'],['#86dcff','#33a6ee'],['#5fe3c4','#22ad97'],['#bdf6dc','#5fd6a8'],['#86e396','#2fb466'],
  ['#d4f374','#8fd43f'],['#fff07a','#f7c843'],['#ffd6a8','#ff9f6b'],['#ffb347','#ff6f2c']];
const cardHue = id => {
  let h = Math.imul(id + 1, 0x9E3779B1); h ^= h >>> 15; h = Math.imul(h, 0x85EBCA77); h ^= h >>> 13;
  return (h >>> 0) % CPAL.length;
};
function tlColors(ids){
  const N = CPAL.length; let prev = -99, prev2 = -99;
  return ids.map(id => {
    let c = cardHue(id);
    const ok = a => a !== prev2 && (prev < 0 || Math.min(Math.abs(a - prev), N - Math.abs(a - prev)) >= 3);
    for (let k = 0; k < N && !ok(c); k++) c = (c + 5) % N;
    prev2 = prev; return prev = c;
  });
}
const cardBg = c => `linear-gradient(150deg,${CPAL[c][0]},${CPAL[c][1]})`;
function tlHTML(ids){ const cols = tlColors(ids); return ids.map((id, k) => cardHTML(id, '', cols[k])).join(''); }
const RULES = { tokens:2, maxTokens:5, changeCost:1, buyCost:3 };   // 시작 토큰 2, 최대 5, 곡 변경 1, 카드 얻기 3
const MAX_TOKENS = RULES.maxTokens;

let ALL = [], CARDS = {};
let S = null;                       // 진행 중인 게임
let undoStack = [];
let ui = { pick:null };             // 도전 자리를 고르는 참가자
let cfg = { players:['플레이어 1','플레이어 2','플레이어 3'], target:10, decades:DECADES.filter(d=>d>=1960) };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec = y => y < 1950 ? 1940 : Math.floor(y/10)*10;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch(e){} },
};

/* ===================== 설정 화면 ===================== */
function renderSetup(){
  $('setup').hidden = false; $('game').hidden = true; $('bUndo').hidden = true; $('bNew').hidden = true; $('topsub').textContent = '';
  const saved = store.get();
  $('bResume').hidden = !savedGameUsable(saved);
  $('plist').innerHTML = cfg.players.map((n,i)=>`
    <div class="prow"><i class="dot" style="background:${PCOLORS[i%PCOLORS.length]}"></i>
      <input id="pn${i}" value="${esc(n)}" maxlength="12" aria-label="참가자 ${i+1} 이름">
      <button class="ghost" type="button" data-del="${i}" aria-label="참가자 ${i+1} 빼기" ${cfg.players.length<=2?'disabled':''}>빼기</button></div>`).join('');
  $('plist').querySelectorAll('input').forEach((el,i)=> el.oninput = () => { cfg.players[i] = el.value; });
  $('plist').querySelectorAll('[data-del]').forEach(b=> b.onclick = () => { cfg.players.splice(+b.dataset.del,1); renderSetup(); });
  $('bAddP').disabled = cfg.players.length >= 10;
  $('pnote').textContent = '2~10명(팀). 진행 순서는 위에서부터';
  $('tVal').textContent = cfg.target;
  const present = new Set(ALL.map(c=>dec(c.y)));   // 곡이 있는 연대만 버튼으로
  $('decades').innerHTML = DECADES.filter(d=>present.has(d)).map(d=>`<button class="dec" type="button" data-dec="${d}" aria-pressed="${cfg.decades.includes(d)}" style="${cfg.decades.includes(d)?`background:${DCOL[d]}`:''}">${d===1940?'40년대 이전':String(d).slice(2)+'년대'}</button>`).join('');
  $('decades').querySelectorAll('[data-dec]').forEach(b=> b.onclick = () => {
    const d = +b.dataset.dec; cfg.decades = cfg.decades.includes(d) ? cfg.decades.filter(x=>x!==d) : [...cfg.decades,d].sort(); renderSetup(); });
  const pool = ALL.filter(c=>cfg.decades.includes(dec(c.y))).length;
  const need = cfg.players.length * cfg.target * 2;
  $('poolNote').textContent = `${pool}곡 중에서 출제` + (pool < need ? ` · 곡 수가 적어 도중에 카드가 떨어질 수 있습니다` : '');
  $('bStart').disabled = pool < 5 || cfg.players.filter(n=>n.trim()).length < 2;
}
$('bAddP').onclick = () => { cfg.players.push('플레이어 ' + (cfg.players.length+1)); renderSetup(); };
$('tMinus').onclick = () => { cfg.target = Math.max(3, cfg.target-1); renderSetup(); };
$('tPlus').onclick = () => { cfg.target = Math.min(30, cfg.target+1); renderSetup(); };
$('bStart').onclick = () => newGame();
function savedGameUsable(s){ return !!(s && s.S && s.S.v === 3 && s.S.n === ALL.length && s.S.phase !== 'over'); }
$('bResume').onclick = () => { const s = store.get(); if (savedGameUsable(s)) { S = s.S; cfg = s.cfg || cfg; undoStack = []; enterGame(); } };
$('bNew').onclick = () => openSheet(`<h2>새 게임을 시작할까요?</h2><p class="muted">지금 게임은 사라집니다.</p>
  <div class="row"><button class="pink" type="button" id="cNew">새 게임</button><button class="ghost" type="button" id="cCancel">계속하기</button></div>`,
  () => { $('cNew').onclick = () => { closeSheet(); stopAll(); S = null; store.set({cfg}); renderSetup(); }; $('cCancel').onclick = closeSheet; });
$('bRules').onclick = showRules;
$('bUndo').onclick = undo;

/* ===================== 게임 상태 ===================== */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function insertSorted(tl, id){ const y = CARDS[id].y; const k = tl.findIndex(x=>CARDS[x].y > y); if (k<0) tl.push(id); else tl.splice(k,0,id); return tl.indexOf(id); }
function slotOk(tl, k, y){ const l = k>0 ? CARDS[tl[k-1]].y : -1e9, r = k<tl.length ? CARDS[tl[k]].y : 1e9; return l <= y && y <= r; }
function okSlots(tl, y){ const out=[]; for (let k=0;k<=tl.length;k++) if (slotOk(tl,k,y)) out.push(k); return out; }
function draw(){ return S.deck.length ? S.deck.pop() : null; }
function active(){ return S.players[S.turn]; }
function snapshot(){ undoStack.push(JSON.stringify(S)); if (undoStack.length > 30) undoStack.shift(); }
function save(){ store.set({ S, cfg }); }

function newGame(){
  const names = cfg.players.map((n,i)=>n.trim() || `플레이어 ${i+1}`);
  S = {
    v: 3, n: ALL.length, target: cfg.target,   // n: 곡 목록이 바뀌면 예전 저장을 쓰지 않기 위함
    deck: shuffle(ALL.filter(c=>cfg.decades.includes(dec(c.y))).map(c=>c.i)),
    players: names.map((n,i)=>({ name:n, color:PCOLORS[i%PCOLORS.length], tokens:RULES.tokens, tl:[] })),
    turn: 0, cur: null, phase: 'listen', result: null, round: 1,
  };
  S.players.forEach(p => { const id = draw(); if (id) p.tl.push(id); });   // 시작 카드 1장씩 공개
  undoStack = [];
  startTurn();
  enterGame();
  toast('모두에게 시작 카드 1장씩 나눠 줬습니다');
}

function startTurn(){
  const id = draw();
  S.result = null; ui.pick = null;
  if (id == null) { S.phase = 'over'; S.overReason = 'deck'; save(); return; }
  S.cur = { id, place:null, ch:[], earned:false };
  S.phase = 'listen';
  save();
}

// 게임 중 화면이 꺼지지 않게 (크롬·노트북 브라우저용. 안 되는 환경이면 조용히 넘어감)
let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch(e){} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S && !$('game').hidden) keepAwake(); });

function enterGame(){
  keepAwake();
  $('setup').hidden = true; $('game').hidden = false; $('bUndo').hidden = false; $('bNew').hidden = false;
  resetClip(); render();
}

/* ===================== 플레이 동작 ===================== */
function tapSlot(k){
  if (S.phase !== 'listen') return;
  if (ui.pick != null) {
    const p = S.players[ui.pick];
    if (k === S.cur.place) return toast('지금 차례인 사람과 같은 자리는 고를 수 없습니다');
    if (S.cur.ch.some(c=>c.slot===k)) return toast('이미 다른 사람이 고른 자리입니다');
    p.tokens -= 1; S.cur.ch.push({ pid:ui.pick, slot:k });
    toast(`${p.name} 도전! 토큰 1개를 걸었습니다`); ui.pick = null; save(); render(); return;
  }
  if (S.cur.ch.length) return toast('도전이 걸린 뒤에는 자리를 바꿀 수 없습니다');
  S.cur.place = (S.cur.place === k) ? null : k; save(); render();
}

function skipSong(){
  const p = active();
  if (S.phase!=='listen' || p.tokens < 1) return;
  snapshot(); p.tokens -= 1;
  S.cur.ch.forEach(c => S.players[c.pid].tokens += 1);    // 걸린 도전은 돌려준다
  resetClip(); startTurn(); toast('토큰 1개로 곡을 바꿨습니다'); render();
}

function startChallenge(pid){ closeSheet(); ui.pick = pid; render(); }
function cancelChallenge(i){ const c = S.cur.ch[i]; S.players[c.pid].tokens += 1; S.cur.ch.splice(i,1); save(); render(); }

function reveal(){
  if (S.phase!=='listen' || S.cur.place==null) return;
  snapshot(); ui.pick = null;
  const p = active(), c = CARDS[S.cur.id];
  const ok = slotOk(p.tl, S.cur.place, c.y);
  // 도전은 "차례인 사람이 틀렸다"에 거는 것: 같은 연도 양옆처럼 둘 다 맞아도 차례인 사람이 우선이고,
  // 차례인 사람이 틀렸을 때만 맞는 자리에 먼저 도전한 사람이 가져간다
  const chWin = ok ? null : S.cur.ch.find(x => slotOk(p.tl, x.slot, c.y));
  const winner = ok ? S.turn : chWin ? chWin.pid : null;
  const chAlsoOk = ok && S.cur.ch.some(x => slotOk(p.tl, x.slot, c.y));
  S.result = { ok, chAlsoOk, winner, good: okSlots(p.tl, c.y), awarded:false };
  if (winner != null) award(winner);
  S.phase = 'reveal';
  checkEnd(); save(); render();
}

function award(pid){
  const p = S.players[pid];
  insertSorted(p.tl, S.cur.id);
  S.result.awarded = true; S.result.newIn = pid;
}

function earnToken(){
  const p = active();
  if (S.phase!=='reveal' || S.cur.earned || p.tokens >= MAX_TOKENS) return;
  snapshot(); p.tokens += 1; S.cur.earned = true; save(); render(); toast(`${p.name} 토큰 +1`);
}

function buyCard(pid){
  const p = S.players[pid];
  if (p.tokens < RULES.buyCost || S.phase==='over') return;
  if (!S.deck.length) return toast('남은 카드가 없습니다');
  snapshot(); p.tokens -= RULES.buyCost;
  const id = draw(); insertSorted(p.tl, id);
  const c = CARDS[id];
  closeSheet(); toast(`${p.name} 카드 획득 · ${c.y} ${c.a} – ${c.s}`);
  checkEnd(); save(); render();
}

function adjustTokens(pid, d){ const p = S.players[pid]; p.tokens = Math.max(0, Math.min(MAX_TOKENS, p.tokens + d)); save(); render(); openPlayer(pid); }

function checkEnd(){
  const w = S.players.findIndex(p => p.tl.length >= S.target);
  if (w >= 0) { S.phase = 'over'; S.overReason = 'win'; S.winnerIdx = w; }
}

function nextTurn(){
  if (S.phase === 'over') return render();
  if (S.phase !== 'reveal') return;
  snapshot();
  resetClip();
  S.turn = (S.turn + 1) % S.players.length; if (S.turn === 0) S.round++;
  startTurn(); render();
}

function undo(){
  if (!undoStack.length) return toast('되돌릴 동작이 없습니다');
  S = JSON.parse(undoStack.pop()); ui.pick = null; resetClip(); save(); render(); toast('한 단계 되돌렸습니다');
}

/* ===================== 그리기 ===================== */
function render(){
  if (!S) return;
  const p = active();
  $('topsub').textContent = `${S.round}라운드 · 남은 곡 ${S.deck.length}`;
  $('who').textContent = `${p.name} 차례`;
  $('who').style.color = p.color;
  $('whoSub').textContent = `연대표 ${p.tl.length}/${S.target}장 · 토큰 ${p.tokens}개`;
  renderFace(); renderStatus(); renderTimeline(); renderActions(); renderScore();
  if (S.phase === 'over') showOver();
}

function renderFace(){
  const f = $('npFace');
  if (S.phase === 'reveal' || (S.phase === 'over' && S.cur && S.result)) {
    const c = CARDS[S.cur.id];
    f.innerHTML = `<div class="ans">${c.c ? `<img src="${esc(c.c)}" alt="${esc(c.a)} 앨범 커버" onerror="this.hidden=true">` : ''}
      <div class="t"><div class="y">${c.y}</div><div class="a">${esc(c.a)}</div><div class="s">${esc(c.s)}</div></div></div>`;
  } else {
    f.innerHTML = `<canvas class="wave" id="wave" aria-hidden="true"></canvas>
      <div class="hint">「정답 공개」 전까지 연도·가수·제목은 가려집니다</div>`;
  }
  f.classList.toggle('hidden', !f.querySelector('.ans'));
  wavePoke();
}

function renderStatus(){
  const st = $('status'), p = active();
  st.className = 'status';
  if (S.phase === 'listen') {
    if (ui.pick != null) { st.classList.add('pick'); st.innerHTML = `${esc(S.players[ui.pick].name)}님, 도전할 자리를 고르세요 <button class="ghost" type="button" id="cPick" style="min-height:34px;padding:4px 10px;margin-left:8px">취소</button>`; $('cPick').onclick = () => { ui.pick = null; render(); }; return; }
    if (S.cur.place == null) st.textContent = `${p.name}님, 이 곡이 들어갈 자리를 연대표에서 고르세요`;
    else {
      const chs = S.cur.ch.map((c,i)=>`<button class="ghost" type="button" data-cc="${i}" style="min-height:30px;padding:2px 8px;font-size:13px;color:${S.players[c.pid].color}">${esc(S.players[c.pid].name)} 도전 취소</button>`).join(' ');
      st.innerHTML = '자리를 골랐습니다. 다른 사람은 「도전」으로 다른 자리에 토큰을 걸 수 있어요. ' + chs;
      st.querySelectorAll('[data-cc]').forEach(b => b.onclick = () => cancelChallenge(+b.dataset.cc));
    }
    return;
  }
  if (S.phase === 'reveal' || S.phase === 'over') {
    const r = S.result; if (!r) { st.textContent = ''; return; }
    const c = CARDS[S.cur.id];
    const where = describeSlot(active().tl, r, c);
    let msg;
    if (r.ok) msg = `정답! ${p.name}님이 카드를 가져갑니다`;
    else if (r.winner != null) msg = `${p.name}님은 틀렸고, ${S.players[r.winner].name}님의 도전 자리가 맞았습니다`;
    else msg = `아쉽게 틀렸습니다. ${where}`;
    if (r.chAlsoOk) msg += ` · 같은 연도라 도전 자리도 맞지만, 차례인 사람이 맞혔으므로 도전은 실패입니다`;
    if (r.ok && S.cur.ch.length) msg += ` · 도전한 ${S.cur.ch.map(ch=>S.players[ch.pid].name).join(', ')}님은 토큰을 잃습니다`;
    st.textContent = msg;
    st.classList.add(r.awarded ? 'good' : 'badc');
  }
}

function describeSlot(tl, r, c){
  const k = r.good[0]; if (k == null) return '';
  const l = k>0 ? CARDS[tl[k-1]].y : null, rr = k<tl.length ? CARDS[tl[k]].y : null;
  if (l==null && rr==null) return '';
  if (l==null) return `정답 자리는 ${rr}년 앞`;
  if (rr==null) return `정답 자리는 ${l}년 뒤`;
  return `정답 자리는 ${l}년과 ${rr}년 사이`;
}

function cardHTML(id, extra='', col=cardHue(id)){
  const c = CARDS[id];
  return `<div class="tc ${extra}" style="background:${cardBg(col)}"><div class="a">${esc(c.a)}</div><div class="y">${c.y}</div><div class="s">${esc(c.s)}</div><span class="k">K-POP</span><span class="no">${c.i}</span></div>`;
}

function ghostHTML(pl, k, label, aria){
  return `<button type="button" class="tc ghost" data-slot="${k}" style="--pc:${pl.color}" aria-label="${esc(aria)}"><div class="a">${esc(pl.name)}</div><div class="y">?</div><div class="s">${label}</div><span class="k">${label === '도전' ? '토큰 1' : ''}</span></button>`;
}

function renderTimeline(){
  const p = active(), tl = p.tl, el = $('tl');
  const listen = S.phase === 'listen';
  const r = S.result, cols = tlColors(tl);
  let h = '';
  for (let k=0; k<=tl.length; k++) {
    if (listen) {
      const ch = S.cur.ch.find(c => c.slot === k);
      if (S.cur.place === k) h += ghostHTML(p, k, '여기에 놓음', '이 자리 선택 취소');
      else if (ch) h += ghostHTML(S.players[ch.pid], k, '도전', `${S.players[ch.pid].name} 도전 자리`);
      else {
        const lab = k===0 ? '맨 앞' : k===tl.length ? '맨 뒤' : `${CARDS[tl[k-1]].y}과 ${CARDS[tl[k]].y} 사이`;
        h += `<button type="button" class="slot" data-slot="${k}" aria-label="${lab}에 놓기">+</button>`;
      }
    } else if (r && k === S.cur.place && r.newIn !== S.turn && !r.ok) {
      h += `<div class="tc miss"><div class="y">✕</div><div class="a">고른 자리</div></div>`;
    }
    if (k < tl.length) h += cardHTML(tl[k], (r && r.awarded && r.newIn===S.turn && tl[k]===S.cur.id) ? 'new' : '', cols[k]);
  }
  el.innerHTML = h || '<div class="tl-empty">연대표가 비어 있습니다</div>';
  el.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => tapSlot(+b.dataset.slot));
  // 고른 자리나 새 카드가 보이게 스크롤
  // 고른 자리나 새 카드가 연대표 가운데 오게 가로로만 스크롤한다 (페이지는 움직이지 않음)
  const focus = el.querySelector('.ghost, .new, .miss'), wrap = $('tlwrap');
  if (focus) wrap.scrollTo({ left: focus.offsetLeft - (wrap.clientWidth - focus.offsetWidth)/2, behavior:'smooth' });
}

function renderActions(){
  const a = $('actions'), p = active();
  let h = `<button class="primary big" type="button" id="aPlay"></button>`;
  if (S.phase === 'listen') {
    h += `<button type="button" id="aSkip" ${p.tokens<RULES.changeCost?'disabled':''}>곡 변경 · 토큰 1</button>`;
    h += `<button type="button" id="aBuy" ${p.tokens<RULES.buyCost || !S.deck.length ?'disabled':''}>카드 얻기 · 토큰 3</button>`;
    h += `<button type="button" id="aCh" ${S.cur.place==null || !eligibleChallengers().length ? 'disabled':''}>도전</button>`;
    h += `<button class="pink big" type="button" id="aRev" ${S.cur.place==null?'disabled':''}>정답 공개</button>`;
  } else if (S.phase === 'reveal') {
    const r = S.result;
    h += `<button class="ok" type="button" id="aEarn" ${S.cur.earned || p.tokens>=MAX_TOKENS ? 'disabled':''}>${S.cur.earned ? '토큰 +1 받음' : p.tokens>=MAX_TOKENS ? '토큰 최대 5개' : `곡명·가수 맞힘 · 토큰 +1`}</button>`;
    h += `<button class="pink big" type="button" id="aNext">다음 차례 ▶</button>`;
  } else if (S.phase === 'over') {
    h += `<button class="pink big" type="button" id="aOver">결과 보기</button>`;
  }
  a.innerHTML = h;
  const on = (id, f) => { const b = $(id); if (b) b.onclick = f; };
  on('aPlay', togglePlay); on('aSkip', skipSong); on('aBuy', () => buyCard(S.turn)); on('aRev', reveal); on('aNext', nextTurn);
  on('aCh', chooseChallenger); on('aEarn', earnToken); on('aOver', showOver);
  updatePlayBtn();
}

function eligibleChallengers(){
  return S.players.map((p,i)=>i).filter(i => i !== S.turn && S.players[i].tokens > 0 && !S.cur.ch.some(c=>c.pid===i));
}
function chooseChallenger(){
  const list = eligibleChallengers();

  let title, sub;
  if (S.overReason === 'win') { const w = S.players[S.winnerIdx]; title = `${w.name} 승리!`; sub = `연대표 ${w.tl.length}장 완성`; }
  else { const best = [...S.players].sort((a,b)=>b.tl.length-a.tl.length)[0]; title = '카드가 다 떨어졌습니다'; sub = `가장 많이 모은 사람: ${best.name} (${best.tl.length}장)`; }

/* ===================== 시트 · 토스트 ===================== */
function openSheet(html, bind){ $('sheetIn').innerHTML = html; $('sheet').hidden = false; if (bind) bind(); }
function closeSheet(){ $('sheet').hidden = true; }
$('sheet').onclick = e => { if (e.target === $('sheet')) closeSheet(); };
let toastT = null;
function toast(t){ const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=> el.hidden = true, 2600); }

/* ===================== 유튜브 하이라이트 ===================== */
let player = null, ytReady = false, pstate = 'idle', clipEnd = 0, played = 0, tick = null, loadTimer = null, wantPlay = false;

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
tag.onerror = () => toast('유튜브에 연결할 수 없습니다. 인터넷 연결을 확인하세요.');
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', { height:'100%', width:'100%',
    playerVars:{ playsinline:1, controls:0, disablekb:1, rel:0, fs:0, iv_load_policy:3, modestbranding:1, origin:location.origin },
    events:{ onReady:()=>{ ytReady = true; if (wantPlay) { wantPlay = false; startClip(); } }, onStateChange:onYT, onError:onYTErr } });
};

function setP(s){ pstate = s; $('np').classList.toggle('playing', s === 'playing'); $('seek').classList.toggle('off', !S || !S.cur || s === 'loading' || s === 'error'); updatePlayBtn(); wavePoke(); }
function updatePlayBtn(){
  const b = $('aPlay'); if (!b) return;
  const left = Math.max(0, Math.ceil(CLIP - played));
  b.disabled = pstate === 'loading' || pstate === 'error' || !S || !S.cur;
  b.innerHTML = pstate === 'playing' ? '❚❚ 일시정지'
    : pstate === 'paused' ? `▶ 이어 듣기 <span style="font-weight:500;opacity:.8">${left}초</span>`
    : pstate === 'done' ? '↻ 하이라이트 다시 듣기'
    : pstate === 'loading' ? '불러오는 중…'
    : pstate === 'error' ? '재생할 수 없는 곡'
    : '▶ 하이라이트 30초';
}
function togglePlay(){
  if (!S || !S.cur) return;
  if (pstate === 'playing') return player.pauseVideo();
  if (pstate === 'paused') return player.playVideo();
  startClip();
}
function startClip(off=0){
  const c = CARDS[S.cur.id];
  if (!ytReady) { wantPlay = true; setP('loading'); return; }
  resetClip(); played = off; showPos(); pickWave(S.cur.id); W.pos = off; setP('loading');
  player.loadVideoById({ videoId:c.v, startSeconds:(c.t || 0) + off });
  if (TEST_MUTE) player.mute(); else { player.unMute(); player.setVolume(100); }
  loadTimer = setTimeout(()=>{ if (pstate === 'loading') { setP('idle'); toast('응답이 늦습니다. 다시 눌러 주세요'); } }, 15000);
}
function resetClip(){
  clearInterval(tick); tick = null; clearTimeout(loadTimer); played = 0; clipEnd = 0; wantPlay = false;
  if (player && player.stopVideo) try { player.stopVideo(); } catch(e){}
  showPos(); setP('idle');
}
function showPos(){
  const f = Math.min(1, Math.max(0, played / CLIP));
  $('bar').style.width = $('knob').style.left = (100*f) + '%';
  $('sec').textContent = Math.ceil(CLIP - played) + '초';
  $('seek').setAttribute('aria-valuenow', Math.round(played));
}
// 진행 막대를 누르거나 끌면 하이라이트 30초 안에서 재생 위치를 옮긴다
function seekTo(f){
  const off = Math.min(CLIP - 0.5, Math.max(0, f * CLIP));
  if (pstate === 'playing' || pstate === 'paused') {
    const start = clipEnd - CLIP;
    played = off; showPos();
    player.seekTo(start + off, true);
  } else if (pstate === 'idle' || pstate === 'done') startClip(off);
}
(() => {
  const el = $('seek'); let drag = false;
  const frac = e => { const r = el.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const preview = f => { $('bar').style.width = $('knob').style.left = (100*f) + '%'; $('sec').textContent = Math.ceil(CLIP*(1-f)) + '초'; };
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('off')) return;
    drag = true; el.classList.add('drag'); el.setPointerCapture(e.pointerId); preview(frac(e)); e.preventDefault();
  });
  el.addEventListener('pointermove', e => { if (drag) preview(frac(e)); });
  const end = e => { if (!drag) return; drag = false; el.classList.remove('drag'); if (e.type === 'pointerup') seekTo(frac(e)); else showPos(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  window.seekDragging = () => drag;
})();
function stopAll(){ resetClip(); }
function finishClip(){ clearInterval(tick); tick = null; try { player.pauseVideo(); } catch(e){} played = CLIP; showPos(); setP('done'); }
function onYT(e){
  const P = YT.PlayerState;
  if (e.data === P.PLAYING) {
    clearTimeout(loadTimer);
    if (pstate === 'loading' || pstate === 'paused') clipEnd = player.getCurrentTime() + (CLIP - played);
    else if (pstate !== 'playing') return;
    setP('playing'); if (!tick) tick = setInterval(onTick, 200);
  } else if (e.data === P.PAUSED && pstate === 'playing') setP('paused');
  else if (e.data === P.ENDED && (pstate === 'playing' || pstate === 'loading')) finishClip();
}
function onTick(){
  if (pstate !== 'playing') return;
  const left = Math.max(0, clipEnd - player.getCurrentTime());
  played = CLIP - left; if (!seekDragging()) showPos();
  if (Math.abs(W.pos - played) > 0.35) W.pos = played;
  if (left <= 0.15) finishClip();
}

/* ===================== 파형 ===================== */
// 유튜브 소리는 페이지에서 읽을 수 없어서, 오디오 스펙트럼처럼 보이는 선을 그린다.
// 칸마다 세기를 위아래로 번갈아 찍은 얇은 선이다(왼쪽 저음 → 오른쪽 고음).
// waves.json 에는 실제 곡 13곡의 하이라이트 30초를 초당 20번, 48개 대역으로 잰 세기(0~35, 한 글자씩)가 들어 있고,
// 곡마다 그중 하나를 무작위로 골라 재생 위치에 맞춰 그린다. 지금 곡이 그 13곡 중 하나면 그 곡 것을 쓴다.
// waves.json 을 못 불러오면 아래 20가지 합성 패턴으로 대신한다.
// bpm 박자마다 kx 자리(배열이면 차례로, scatter 면 아무 데나, move 면 좌우로 흐름)에 봉우리가 솟고 kd 속도로 가라앉는다.
// mirror 반대편에도, k2 옆에 작은 봉우리, dbl 초 뒤에 한 번 더(심장박동), sn 확률로 snR 범위에 작은 봉우리.
// mid·mx·mw 는 잔잔한 중음 떨림, hi·hx 는 오른쪽 고음 출렁임, off 는 엇박 확률
const WAVE_PATTERNS = [
  { bpm:120, kx:.075, kw:.024, k2:.2, sn:.45 },                                   // 참고 영상: 왼쪽 저음 킥
  { bpm:100, kx:.5, kw:.03, sn:.3, mid:.03, hi:.04 },                             // 가운데 맥박
  { bpm:116, kx:.925, kw:.024, k2:.2, k2dx:-.075, sn:.4, snR:[.12,.7], hi:.03 },  // 오른쪽 저음
  { bpm:110, kx:.08, kw:.024, mirror:1, sn:.3, snR:[.3,.7] },                     // 양 끝 대칭
  { bpm:140, scatter:1, kw:.018, a:.8, sn:0 },                                    // 아무 데나 톡톡
  { bpm:70, kx:.3, kw:.06, a:.7, kd:2.5, mid:.06, mw:.5, hi:.02, off:0 },         // 발라드: 넓고 느리게
  { bpm:128, move:.7, kw:.022, sn:.2 },                                           // 좌우로 흐르는 봉우리
  { bpm:160, kx:.5, kw:.18, a:.45, kd:6, hi:.15, hx:.55, off:0 },                 // 하이햇 떨림
  { bpm:96, kx:.25, kw:.022, k2:.9, k2dx:.5, sn:.2 },                             // 두 봉우리 동시
  { bpm:180, kx:[.2,.5,.8], kw:.02, a:.6, kd:7, off:0 },                          // 셋잇단 왼·가운데·오른
  { bpm:130, kx:[.12,.32,.52,.72,.9], kw:.02, kd:5.5, off:0 },                    // 계단 오르기
  { bpm:130, kx:[.9,.7,.5,.3,.12], kw:.02, kd:5.5, off:0 },                       // 계단 내리기
  { bpm:68, kx:.5, kw:.03, dbl:.16, kd:6, mid:.025, hi:.03, off:0 },              // 심장박동
  { bpm:140, kx:.1, kw:.022, off:.5, hi:.13, hx:.6, sn:.3 },                      // 트랩: 잘게 쪼갠 킥
  { bpm:60, kx:.5, kw:.1, a:.4, kd:1.8, mid:.08, mx:.5, mw:.45, hi:.03, off:0 },  // 잔잔한 허밍
  { bpm:128, kx:.35, kw:.026, a:1.1, mirror:1, sn:.25, snR:[.45,.55] },          // EDM 드롭
  { bpm:140, kx:.06, kw:.024, k2:.5, k2dx:.1, sn:.7, snR:[.4,.62] },              // 록: 킥과 스네어
  { bpm:240, scatter:1, kw:.01, a:.38, kd:8, mid:.02, hi:.04, off:0 },            // 반짝이
  { bpm:110, kx:[.2,.8], kw:.024, sn:.2, off:0 },                                 // 좌우 번갈아
  { bpm:90, kx:.5, kw:.08, a:.9, kd:3.5, sn:.5, snR:[.08,.92] },                  // 가운데에서 피어남
];
const W = { raf:0, energy:0, last:0, real:null, reals:null, realIdx:-1, pos:0, nextKick:0, step:0, hits:[], noiseAt:0, amp:null, noise:null, pat:WAVE_PATTERNS[0], patIdx:0, patFor:null, c1:'#7c5cff', c2:'#ff5c8a' };
(() => { const cs = getComputedStyle(document.documentElement); W.c1 = cs.getPropertyValue('--accent').trim() || W.c1; W.c2 = cs.getPropertyValue('--accent2').trim() || W.c2; })();
const calm = matchMedia('(prefers-reduced-motion: reduce)');
// 곡이 바뀔 때만 새 패턴을 고른다 (바로 앞 패턴은 피함). 같은 곡을 다시 듣거나 위치를 옮기면 그대로
fetch('waves.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).then(list => {
  if (!list || !list.length) return;
  W.reals = list.map(o => ({ i:o.i, fps:o.fps, b:o.b, n:o.n, v:Uint8Array.from(o.d, ch => parseInt(ch, 36)) }));
}).catch(() => {});
function pickWave(id){
  if (W.patFor === id) return;
  if (W.reals) {
    let k = W.reals.findIndex(o => o.i === id);
    if (k < 0) do k = Math.floor(Math.random() * W.reals.length); while (W.reals.length > 1 && k === W.realIdx);
    W.realIdx = k; W.real = W.reals[k]; W.patFor = id; return;
  }
  let k; do k = Math.floor(Math.random() * WAVE_PATTERNS.length); while (k === W.patIdx);
  W.patIdx = k; W.pat = WAVE_PATTERNS[k]; W.patFor = id; W.step = 0; W.hits = [];
}
function wavePoke(){ if (!W.raf && $('wave')) W.raf = requestAnimationFrame(waveFrame); }
function waveFrame(ts){
  W.raf = 0;
  const cv = $('wave'); if (!cv || !cv.isConnected) return;
  const dt = Math.min(0.05, W.last ? (ts - W.last) / 1000 : 0.016); W.last = ts;
  const t = ts / 1000, on = pstate === 'playing', P = W.pat;
  W.energy += ((on ? 1 : 0) - W.energy) * (1 - Math.exp(-dt * (on ? 8 : 3)));
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) { if (on) W.raf = requestAnimationFrame(waveFrame); return; }
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const pad = 8, n = Math.max(60, Math.min(240, Math.round((w - 2*pad) / 4.5)));
  if (!W.amp || W.amp.length !== n + 1) { W.amp = new Float32Array(n + 1); W.noise = new Float32Array(n + 1); }
  if (on) W.pos += dt;
  if (!W.real && on && t >= W.nextKick) {
    const x = Array.isArray(P.kx) ? P.kx[W.step % P.kx.length]
      : P.scatter ? 0.06 + Math.random()*0.88
      : P.move ? 0.12 + 0.76*(0.5 + 0.5*Math.sin(t * P.move))
      : P.kx;
    W.step++;
    const a = (P.a ?? 0.9) * (0.8 + Math.random()*0.35), kd = P.kd ?? 5;
    const hit = (x, a, wd, delay = 0, d = kd) => W.hits.push({ x, a, w: wd, b: t + delay, d });
    hit(x, a, P.kw);
    if (P.mirror) hit(1 - x, a, P.kw);
    if (P.k2) hit(x + (P.k2dx ?? 0.075), a * P.k2, P.kw * 0.85);
    if (P.dbl) hit(x, a * 0.75, P.kw, P.dbl);
    if (P.sn && Math.random() < P.sn) { const [s0, s1] = P.snR || [0.28, 0.88]; hit(s0 + Math.random()*(s1 - s0), 0.18 + Math.random()*0.15, 0.014, 0, 7); }
    const iv = 60 / P.bpm;
    W.nextKick = t + (Math.random() < (P.off ?? 0.25) ? iv / 2 : iv) + (Math.random() - 0.5)*0.03;
  }
  W.hits = W.hits.filter(k => k.a * Math.exp(-Math.max(0, t - k.b) * k.d) > 0.01);
  // 중음·고음은 짧은 간격으로 새 목표값을 뽑고, 이웃 칸끼리 비슷하게 묶는다
  if (t >= W.noiseAt) {
    W.noiseAt = t + 0.06 + Math.random()*0.05;
    const mid = P.mid ?? 0.045, mx = P.mx ?? 0.42, mw = P.mw ?? 0.3, hi = P.hi ?? 0.08, hx = P.hx ?? 0.78;
    let r = 0;
    for (let i = 0; i <= n; i++) {
      const x = i / n; r = r*0.6 + Math.random()*0.4;
      W.noise[i] = mid * (0.27 + r) * Math.exp(-(((x - mx) / mw) ** 2)) * (0.7 + 0.3*Math.sin(t*1.1 + x*7))
        + hi * (0.25 + r) * Math.max(0, (x - hx) / (1 - hx)) + 0.012*r;
    }
  }
  const up = 1 - Math.exp(-dt * 35), down = 1 - Math.exp(-dt * 9);
  const R = W.real, fp = R ? Math.max(0, W.pos) * R.fps : 0;
  const f0 = R ? Math.floor(fp) % R.n : 0, f1 = R ? (f0 + 1) % R.n : 0, ff = fp - Math.floor(fp);
  let peak = 0;
  for (let i = 0; i <= n; i++) {
    const x = i / n;
    let tgt = 0;
    if (on && R) {
      // 프레임 사이, 대역 사이를 선형 보간
      const bp = x * (R.b - 1), b0 = Math.floor(bp), b1 = Math.min(R.b - 1, b0 + 1), bf = bp - b0;
      const at = f => R.v[f*R.b + b0] * (1 - bf) + R.v[f*R.b + b1] * bf;
      tgt = Math.min(1, 1.25 * ((at(f0) * (1 - ff) + at(f1) * ff) / 35) ** 1.4);
    } else if (on) {
      let bass = 0;
      for (const k of W.hits) { if (t < k.b) continue; const z = (x - k.x) / k.w; bass += k.a * Math.exp(-(t - k.b) * k.d) * Math.exp(-z*z); }
      tgt = Math.min(1, 1.35*bass + W.noise[i]);
    }
    W.amp[i] += (tgt - W.amp[i]) * (tgt > W.amp[i] ? up : down);
    peak = Math.max(peak, W.amp[i]);
  }
  const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const mid = h/2, A = h*0.48*(calm.matches ? 0.4 : 1), base = Math.min(2.5, h*0.015);
  const grad = g.createLinearGradient(pad,0,w-pad,0);
  grad.addColorStop(0, W.c1); grad.addColorStop(0.5, W.c2); grad.addColorStop(1, W.c1);
  g.beginPath();
  for (let i = 0; i <= n; i++) {
    const px = pad + (i / n) * (w - 2*pad), sgn = (i % 2) ? 1 : -1;
    const y = mid + sgn * (base + A * W.amp[i]);
    i ? g.lineTo(px, y) : g.moveTo(px, y);
  }
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.globalAlpha = 0.55 + 0.45*W.energy;
  g.shadowColor = W.c2; g.shadowBlur = 3 + 5*W.energy;
  g.strokeStyle = grad; g.lineWidth = Math.max(1.6, Math.min(2.4, w/400)); g.stroke();
  g.globalAlpha = 1; g.shadowBlur = 0;
  if (on || peak > 0.003) W.raf = requestAnimationFrame(waveFrame);
}
addEventListener('resize', wavePoke);
function onYTErr(e){ clearTimeout(loadTimer); clearInterval(tick); tick = null; setP('error'); toast(`이 곡은 재생할 수 없습니다 (코드 ${e.data}). 곡 변경이나 정답 공개로 넘어가세요`); }

/* ===================== 키보드 (노트북·TV 진행용) ===================== */
document.addEventListener('keydown', e => {
  if (!S || $('game').hidden || !$('sheet').hidden || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Enter') { e.preventDefault(); if (S.phase === 'listen') reveal(); else if (S.phase === 'reveal') nextTurn(); else showOver(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && S.phase === 'listen' && ui.pick == null && !S.cur.ch.length) {
    const n = active().tl.length; const k = S.cur.place == null ? (e.key === 'ArrowLeft' ? n : 0) : S.cur.place + (e.key === 'ArrowLeft' ? -1 : 1);
    S.cur.place = Math.max(0, Math.min(n, k)); save(); render();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && pstate === 'playing') try { player.pauseVideo(); } catch(e){} });

/* ===================== 안드로이드 앱 연결 ===================== */
// 뒤로가기: 열린 창을 닫고, 게임 중이면 설정 화면으로(게임은 저장되어 「이어 하기」 가능). 처리했으면 true.
window.onBack = () => {
  if (!$('sheet').hidden) { closeSheet(); return true; }
  if (ui.pick != null) { ui.pick = null; render(); return true; }
  if (S && !$('game').hidden) { stopAll(); save(); renderSetup(); return true; }
  return false;
};
window.onAppPause = () => { if (pstate === 'playing') try { player.pauseVideo(); } catch(e){} };

/* ===================== 시작 ===================== */
fetch('cards.json', { cache:'no-cache' }).then(r => r.json()).then(d => {
  ALL = d; d.forEach(c => CARDS[c.i] = c);
  $('foot').textContent = `${ALL.length.toLocaleString()}곡 · 멜론 연간차트 · 벅스 연도별 베스트 · 유튜브 하이라이트 30초`;
  const s = store.get(); if (s && s.cfg) cfg = Object.assign(cfg, s.cfg);
  renderSetup();
}).catch(() => { document.body.innerHTML = '<p style="padding:24px">곡 목록(cards.json)을 불러오지 못했습니다. 시작 프로그램으로 열어 주세요.</p>'; });
